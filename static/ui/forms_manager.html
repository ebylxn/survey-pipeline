<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Trust Bridge - Quản Lý Biểu Mẫu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090d16;
            --surface: #131b2e;
            --surface-hover: #1c2742;
            --border: #23314f;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --success: #10b981;
            --text: #f8fafc;
            --muted: #94a3b8;
            --card-radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px 16px;
        }

        /* Expanded container: >40% wider than 900px */
        .container {
            max-width: 1440px;
            width: 96%;
            margin: 0 auto;
        }

        /* Top Branded Trust Bridge Header */
        .brand-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.9) 100%);
            border: 1px solid var(--border);
            border-radius: var(--card-radius);
            padding: 16px 22px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            flex-wrap: wrap;
            gap: 14px;
        }

        .brand-banner-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-logo-wrap {
            width: 44px;
            height: 44px;
            background: rgba(37, 99, 235, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-banner-title h1 {
            font-size: 1.25rem;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .brand-banner-title p {
            font-size: 0.8rem;
            color: var(--muted);
            margin-top: 2px;
        }

        .nav-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .nav-btn:hover {
            background: var(--surface-hover);
            border-color: #3b82f6;
            color: #60a5fa;
        }

        .nav-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .nav-btn.primary:hover {
            background: var(--accent-hover);
        }

        /* Filter & Sorting Bar Above Forms List */
        .filter-toolbar {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--card-radius);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .search-wrap {
            flex: 1;
            min-width: 240px;
            position: relative;
        }

        .search-input {
            width: 100%;
            background: #090d16;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px 8px 34px;
            color: #fff;
            font-size: 0.82rem;
            outline: none;
        }

        .search-input:focus {
            border-color: #3b82f6;
        }

        .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            fill: var(--muted);
            pointer-events: none;
        }

        .filter-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .select-filter {
            background: #090d16;
            border: 1px solid var(--border);
            color: #fff;
            padding: 7px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            outline: none;
            cursor: pointer;
        }

        .view-btn {
            background: var(--surface-hover);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.78rem;
        }

        .view-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        /* Forms Layout: Grid Mode with equal height rows */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
            align-items: stretch;
        }

        .form-item-card {
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .form-item-card:hover {
            border-color: #3b82f6;
            transform: translateY(-2px);
        }

        .form-card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Title Capped to exactly 3 lines with ellipsis, fixed min-height for row alignment */
        .form-item-card h3 {
            font-size: 0.98rem;
            font-weight: 700;
            color: #fff;
            line-height: 1.4;
            min-height: 4.2em;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .form-item-meta {
            font-size: 0.8rem;
            color: var(--muted);
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: rgba(15, 23, 42, 0.4);
            padding: 8px 10px;
            border-radius: 6px;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.72rem;
            font-weight: 700;
        }
        .badge.active { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .badge.test { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }

        .form-actions {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }

        .btn-action {
            flex: 1;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            color: #fff;
            text-decoration: none;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.15s ease;
            background: var(--surface-hover);
        }

        .btn-action.qr:hover { background: #0284c7; border-color: #0284c7; }
        .btn-action.view:hover { background: #10b981; border-color: #10b981; }
        .btn-action.edit:hover { background: #2563eb; border-color: #2563eb; }
        .btn-action.export:hover { background: #7c3aed; border-color: #7c3aed; }
        .btn-action svg { width: 16px; height: 16px; }

        /* Row Mode (List View) */
        .form-grid.row-mode {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-grid.row-mode .form-item-card {
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 18px;
        }

        .form-grid.row-mode .form-card-top {
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            flex: 0 0 170px;
            min-width: 0;
        }

        /* Fixed-width first column keeps every row's title/meta/actions aligned. */
        .form-grid.row-mode .form-card-top > span {
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .form-grid.row-mode .form-item-card h3 {
            min-height: auto;
            -webkit-line-clamp: 1;
            flex: 2 1 0;
            min-width: 0;
        }

        .form-grid.row-mode .form-item-meta {
            flex: 2 1 0;
            min-width: 0;
            flex-direction: row;
            gap: 16px;
            align-items: center;
            background: none;
            padding: 0;
        }

        .form-grid.row-mode .form-item-meta > div {
            flex: 1 1 0;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .form-grid.row-mode .form-actions {
            flex: 1 1 0;
            margin-top: 0;
            min-width: 0;
            max-width: 150px;
        }

        /* Pagination & Page Size Row */
        .pagination-row {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--card-radius);
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .pagination-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-page {
            background: var(--surface-hover);
            border: 1px solid var(--border);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 600;
        }

        .btn-page.disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .page-indicator {
            font-size: 0.82rem;
            color: var(--muted);
        }

        .page-size-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--muted);
        }

        /* Clean Canonical QR Code Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 16px;
        }

        .modal-card {
            background: #0f172a;
            border: 1px solid var(--border);
            border-top: 5px solid #10b981;
            border-radius: 16px;
            max-width: 440px;
            width: 100%;
            padding: 22px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
        .modal-title-group h3 {
            font-size: 1.05rem;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-title-group p {
            font-size: 0.8rem;
            color: var(--muted);
            margin-top: 3px;
        }

        .btn-close-modal {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--muted);
            font-size: 1.3rem;
            cursor: pointer;
            border-radius: 6px;
            padding: 2px 8px;
            line-height: 1;
        }

        .btn-close-modal:hover { color: #fff; }

        .qr-canvas-box {
            background: #ffffff;
            padding: 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            align-self: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            min-width: 220px;
            min-height: 220px;
        }

        .url-box {
            background: #090d16;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 10px;
            color: #38bdf8;
            font-family: monospace;
            font-size: 0.8rem;
            width: 100%;
            outline: none;
        }

        .modal-btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-modal-action {
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.82rem;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Top Branded Trust Bridge Header -->
        <div class="brand-banner">
            <div class="brand-banner-left">
                <div class="brand-logo-wrap">
                    <svg viewBox="0 0 24 24" style="width:24px; height:24px; fill:#38bdf8;"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
                </div>
                <div class="brand-banner-title">
                    <h1 id="txtAdminTitle">
                        Quản Lý Biểu Mẫu Khảo Sát
                        <span id="envBadge"></span>
                    </h1>
                    <p id="txtAdminSub">Hệ Thống Trust Bridge SSOT: Cấu hình biểu mẫu, cấp mã QR chia sẻ, và định tuyến đối soát <span id="envSubtext"></span></p>
                </div>
            </div>
            <div class="nav-actions">
                <a href="/api/v1/forms/export" class="nav-btn" id="btnExportAllForms" download>
                    <svg viewBox="0 0 24 24" style="width:16px; height:16px; fill:currentColor;"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>
                    Xuất tất cả
                </a>
                <button type="button" class="nav-btn" id="btnImportForms" onclick="document.getElementById('importFormsFile').click()">
                    <svg viewBox="0 0 24 24" style="width:16px; height:16px; fill:currentColor;"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zM5 18h14v2H5v-2z"/></svg>
                    Nhập biểu mẫu
                </button>
                <input type="file" id="importFormsFile" accept="application/json,.json" style="display:none" onchange="importFormsFile(this)">
                <a href="/admin/forms/create" class="nav-btn primary" id="btnAdminCreate">
                    <svg viewBox="0 0 24 24" style="width:16px; height:16px; fill:currentColor;"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    Tạo Biểu Mẫu Mới
                </a>
            </div>
        </div>

        <!-- Filter & Sorting Bar Above Forms List -->
        <div class="filter-toolbar">
            <div class="search-wrap">
                <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 14 14 9.5 14z"/></svg>
                <input type="text" id="filterSearchInput" class="search-input" placeholder="Lọc biểu mẫu theo tên hoặc mã form..." oninput="applyClientFilter()">
            </div>
            <div class="filter-controls">
                <select id="statusFilter" class="select-filter" onchange="applyClientFilter()">
                    <option value="all">Tất cả trạng thái</option>
                    <option value="active">Chính thức</option>
                    <option value="test">Thử nghiệm</option>
                </select>
                <select id="sortFilter" class="select-filter" onchange="changeSortOrder(this.value)">
                    <option value="updated_desc">Sắp xếp: Mới sửa đổi</option>
                    <option value="default">Sắp xếp: Mặc định</option>
                    <option value="name_asc">Tên (A → Z)</option>
                    <option value="name_desc">Tên (Z → A)</option>
                    <option value="questions_desc">Số câu hỏi (Nhiều nhất)</option>
                </select>
                <button type="button" class="view-btn active" id="btnViewGrid" onclick="setFormViewMode('grid')">
                    <svg viewBox="0 0 24 24" style="width:14px; height:14px; fill:currentColor;"><path d="M3 3v8h8V3H3zm6 6H5V5h4v4zm-6 4v8h8v-8H3zm6 6H5v-4h4v4zm4-16v8h8V3h-8zm6 6h-4V5h4v4zm-6 4v8h8v-8h-8zm6 6h-4v-4h4v4z"/></svg>
                    Lưới
                </button>
                <button type="button" class="view-btn" id="btnViewRow" onclick="setFormViewMode('row')">
                    <svg viewBox="0 0 24 24" style="width:14px; height:14px; fill:currentColor;"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
                    Dòng
                </button>
            </div>
        </div>

        <!-- Dynamic Form Grid / Rows -->
        <div class="form-grid" id="formsContainer">
            {forms_cards_html}
        </div>

        <!-- Pagination Controls Row with Page Size Selector -->
        <div class="pagination-row">
            <div class="pagination-controls">
                <a href="{prev_page_href}" class="btn-page ">Trang trước</a>
                <span class="page-indicator">Trang <span id="currentPageNum">1</span> / <span id="totalPagesNum">1</span> (Tổng <span id="totalFormsCount">0</span> biểu mẫu)</span>
                <a href="{next_page_href}" class="btn-page ">Trang sau</a>
            </div>
            <div class="page-size-wrap">
                <span>Số lượng hiển thị:</span>
                <select id="pageSizeSelect" class="select-filter" onchange="changePageSize(this.value)">
                    {page_size_options}
                </select>
            </div>
        </div>
    </div>

    <!-- Redesigned Clean Canonical QR Code Modal Popup -->
    <div id="adminQrModal" class="modal-overlay" onclick="if(event.target===this)closeAdminQrModal()">
        <div class="modal-card">
            <div class="modal-header-row">
                <div class="modal-title-group">
                    <h3 id="adminQrModalTitle">
                        <svg viewBox="0 0 24 24" style="width:20px; height:20px; fill:#10b981;"><path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm13-2h3v2h-3v-2zm-3 2h2v3h-2v-3zm3 3h3v3h-3v-3zm-5 1h2v2h-2v-2zm3-3h2v2h-2v-2zM7 7h-.01v.01H7V7zm10 0h-.01v.01H17V7zM7 17h-.01v.01H7V17z"/></svg>
                        Chia Sẻ Mã QR Biểu Mẫu
                    </h3>
                    <p id="adminQrFormTitle" style="color:#60a5fa; font-weight:600;"></p>
                </div>
                <button type="button" class="btn-close-modal" onclick="closeAdminQrModal()">&times;</button>
            </div>

            <!-- Centered QR Code -->
            <div id="adminQrCodeContainer" class="qr-canvas-box"></div>

            <!-- Direct Canonical Form URL (No Random Subdomain) -->
            <div>
                <label style="font-size:0.75rem; color:var(--muted); font-weight:700; margin-bottom:4px; display:block;">ĐƯỜNG DẪN BIỂU MẪU CHÍNH THỨC</label>
                <input type="text" id="adminQrShareUrlInput" class="url-box" readonly />
            </div>

            <!-- CTV attribution -->
            <div>
                <label style="font-size:0.75rem; color:var(--muted); font-weight:700; margin-bottom:4px; display:block;">GẮN MÃ CTV (TÙY CHỌN)</label>
                <div style="display:flex; gap:8px;">
                    <select id="adminQrCtvSelect" class="url-box" style="flex:1; cursor:pointer;">
                        <option value="">Không gắn CTV</option>
                    </select>
                    <button type="button" id="adminQrGenerateBtn" onclick="generateAdminQr()" class="btn-modal-action" style="flex:0 0 auto; background:#0ea5e9; color:#fff; padding:8px 14px;">
                        <span>Tạo mã QR</span>
                    </button>
                </div>
                <p id="adminQrCtvHint" style="font-size:0.72rem; color:var(--muted); margin:6px 0 0;"></p>
            </div>

            <!-- Action Buttons -->
            <div class="modal-btn-grid">
                <button type="button" onclick="copyAdminQrLink()" class="btn-modal-action" style="background:#2563eb; color:#fff;">
                    <svg viewBox="0 0 24 24" style="width:16px; height:16px; fill:currentColor;"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                    <span>Sao Chép Link</span>
                </button>
                <button type="button" onclick="saveAdminQrImage()" class="btn-modal-action" style="background:rgba(16,185,129,0.18); border:1px solid #10b981; color:#10b981;">
                    <svg viewBox="0 0 24 24" style="width:16px; height:16px; fill:currentColor;"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
                    <span>Lưu Ảnh QR (.png)</span>
                </button>
            </div>
        </div>
    </div>

    <script src="/static/qrcode.min.js"></script>
    <script>
        let currentAdminQrFormId = "";

        async function importFormsFile(input) {
            const file = input && input.files ? input.files[0] : null;
            if (!file) return;
            let payload;
            try {
                payload = JSON.parse(await file.text());
            } catch (err) {
                alert('Tệp JSON không hợp lệ: ' + err.message);
                input.value = '';
                return;
            }
            const overwrite = confirm(
                'Nếu mã biểu mẫu đã tồn tại, bạn có muốn ghi đè không?\n\n' +
                'Bấm OK để ghi đè (schema cũ được sao lưu vào data/form_backups).\n' +
                'Bấm Hủy để chỉ nhập các biểu mẫu mới.'
            );
            const button = document.getElementById('btnImportForms');
            if (button) { button.disabled = true; button.textContent = 'Đang nhập...'; }
            try {
                const resp = await fetch('/api/v1/forms/import?overwrite=' + (overwrite ? 'true' : 'false'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(payload)
                });
                let body = null;
                try { body = await resp.json(); } catch (err) { body = null; }
                if (!resp.ok) {
                    const detail = body && body.detail;
                    let message = detail && detail.message ? detail.message : JSON.stringify(detail || body || {});
                    if (detail && Array.isArray(detail.conflicts)) {
                        message += '\nMã trùng: ' + detail.conflicts.join(', ');
                    }
                    alert('Lỗi nhập (HTTP ' + resp.status + '): ' + message);
                    return;
                }
                alert('Đã nhập ' + ((body && body.count) || 0) + ' biểu mẫu.');
                window.location.reload();
            } catch (err) {
                alert('Lỗi kết nối: ' + err.message);
            } finally {
                input.value = '';
                if (button) { button.disabled = false; button.textContent = 'Nhập biểu mẫu'; }
            }
        }

        function setFormViewMode(mode) {
            const container = document.getElementById("formsContainer");
            const btnGrid = document.getElementById("btnViewGrid");
            const btnRow = document.getElementById("btnViewRow");
            if (mode === "row") {
                container.classList.add("row-mode");
                btnRow.classList.add("active");
                btnGrid.classList.remove("active");
                localStorage.setItem("tb_forms_view", "row");
            } else {
                container.classList.remove("row-mode");
                btnGrid.classList.add("active");
                btnRow.classList.remove("active");
                localStorage.setItem("tb_forms_view", "grid");
            }
        }

        function applyClientFilter() {
            const q = (document.getElementById("filterSearchInput").value || "").toLowerCase().trim();
            const status = document.getElementById("statusFilter").value;
            const sort = document.getElementById("sortFilter").value;
            const cards = Array.from(document.querySelectorAll(".form-item-card"));

            cards.forEach(card => {
                const title = card.getAttribute("data-title") || "";
                const formId = card.getAttribute("data-form-id") || "";
                const cStatus = card.getAttribute("data-status") || "";

                const matchQ = !q || title.includes(q) || formId.includes(q);
                const matchStatus = (status === "all") || (cStatus === status);

                if (matchQ && matchStatus) {
                    card.style.display = "flex";
                } else {
                    card.style.display = "none";
                }
            });

            // Sorting
            const container = document.getElementById("formsContainer");
            const visibleCards = cards.filter(c => c.style.display !== "none");
            if (sort === "name_asc") {
                visibleCards.sort((a, b) => (a.getAttribute("data-title") || "").localeCompare(b.getAttribute("data-title") || ""));
            } else if (sort === "name_desc") {
                visibleCards.sort((a, b) => (b.getAttribute("data-title") || "").localeCompare(a.getAttribute("data-title") || ""));
            } else if (sort === "questions_desc") {
                visibleCards.sort((a, b) => parseInt(b.getAttribute("data-questions") || "0") - parseInt(a.getAttribute("data-questions") || "0"));
            }
            visibleCards.forEach(c => container.appendChild(c));
        }

        function changeSortOrder(sort) {
            const url = new URL(window.location.href);
            url.searchParams.set("sort", sort);
            url.searchParams.set("page", "1");
            window.location.href = url.toString();
        }

        function changePageSize(size) {
            const url = new URL(window.location.href);
            url.searchParams.set("size", size);
            url.searchParams.set("page", "1");
            window.location.href = url.toString();
        }

        let currentAdminQrBaseUrl = "";

        function openAdminQrModal(formId, formTitle) {
            currentAdminQrFormId = formId;
            currentAdminQrBaseUrl = window.location.origin + "/forms/" + encodeURIComponent(formId);
            document.getElementById("adminQrFormTitle").textContent = formTitle;

            const card = Array.from(document.querySelectorAll(".form-item-card")).find(el => el.dataset.formId === formId);
            const enabled = !card || card.dataset.ctvRefEnabled !== "false";
            const options = card ? JSON.parse(card.dataset.ctvOptions || "[]") : [];
            const select = document.getElementById("adminQrCtvSelect");
            select.innerHTML = "";
            select.appendChild(new Option("Không gắn CTV", ""));
            options.forEach(opt => select.appendChild(new Option(opt.label === opt.code ? opt.label : `${opt.label} (${opt.code})`, opt.code)));
            select.value = "";
            select.disabled = !enabled;
            document.getElementById("adminQrGenerateBtn").disabled = !enabled;
            const hint = document.getElementById("adminQrCtvHint");
            hint.textContent = !enabled
                ? "Biểu mẫu này đã tắt link CTV trong phần cài đặt."
                : (options.length ? "Chọn CTV rồi bấm Tạo mã QR để gắn ?ref=." : "Biểu mẫu chưa có danh sách CTV; mã QR sẽ dùng link chuẩn.");

            document.getElementById("adminQrShareUrlInput").value = currentAdminQrBaseUrl;
            const modal = document.getElementById("adminQrModal");
            modal.style.display = "flex";
            renderAdminQr(currentAdminQrBaseUrl);
        }

        function generateAdminQr() {
            const ref = document.getElementById("adminQrCtvSelect").value;
            const url = ref ? `${currentAdminQrBaseUrl}?ref=${encodeURIComponent(ref)}` : currentAdminQrBaseUrl;
            document.getElementById("adminQrShareUrlInput").value = url;
            renderAdminQr(url);
        }

        function closeAdminQrModal() {
            document.getElementById("adminQrModal").style.display = "none";
        }

        function renderAdminQr(text) {
            const container = document.getElementById("adminQrCodeContainer");
            container.innerHTML = "";
            if (typeof QRCode !== 'undefined') {
                new QRCode(container, {
                    text: text,
                    width: 220,
                    height: 220,
                    colorDark: "#090d16",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.M
                });
            } else {
                container.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(text)}" alt="QR Code" style="width:220px;height:220px;">`;
            }
        }

        function copyAdminQrLink() {
            const input = document.getElementById("adminQrShareUrlInput");
            if (input) {
                navigator.clipboard.writeText(input.value).then(() => {
                    alert("Đã sao chép đường dẫn biểu mẫu chính thức!");
                }).catch(() => {
                    prompt("Sao chép liên kết:", input.value);
                });
            }
        }

        function saveAdminQrImage() {
            const container = document.getElementById("adminQrCodeContainer");
            if (!container) return;
            const canvas = container.querySelector("canvas");
            let imgUri = "";
            if (canvas) {
                const pad = 24;
                const out = document.createElement("canvas");
                out.width = canvas.width + pad * 2;
                out.height = canvas.height + pad * 2;
                const ctx = out.getContext("2d");
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, out.width, out.height);
                ctx.drawImage(canvas, pad, pad);
                imgUri = out.toDataURL("image/png");
            } else {
                const img = container.querySelector("img");
                if (img && img.src) imgUri = img.src;
            }
            if (!imgUri) return;
            const a = document.createElement("a");
            a.href = imgUri;
            a.download = `QR_${currentAdminQrFormId}.png`;
            a.click();
        }

        
        async function loadFormsList() {
            const urlParams = new URLSearchParams(window.location.search);
            const page = urlParams.get("page") || "1";
            const size = urlParams.get("size") || "6";
            
            // Populate page size select
            const sizeSel = document.getElementById("pageSizeSelect");
            if (sizeSel) sizeSel.value = size;
            const sortSel = document.getElementById("sortFilter");
            if (sortSel) sortSel.value = urlParams.get("sort") || sortSel.dataset.activeSort || "updated_desc";

        }
        document.addEventListener("DOMContentLoaded", loadFormsList);

        document.addEventListener("DOMContentLoaded", () => {
            const savedView = localStorage.getItem("tb_forms_view");
            if (savedView) setFormViewMode(savedView);
        });
    </script>
</body>
</html>
